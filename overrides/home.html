{% extends "main.html" %}
{% block tabs %}
<style>
    .mdx-container,
    .mdx-container .md-grid {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
    }

    .mdx-hero {
        position: relative;
        min-height: calc(100vh - 2.4rem);
    }

    .mdx-hero__image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .mdx-hero__image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    input::placeholder {
        color: white !important;
    }

    .md-search__input:not(:focus-visible) + .md-search__icon:not(.md-search__options) {
        color: white !important;
    }

    .mdx-hero__content {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(90vw, 48rem);
        transform: translate(-50%, -50%);
        color: white;
        text-align: center;
    }

    .mdx-hero__content h1,
    .mdx-hero__content p {
        color: white;
    }

    .md-button {
        margin-top: 10px;
        background-color: #dd2e57 !important;
        border-color: #dd2e57 !important;
    }

    .md-button:hover {
        transform: scale(1.05);
    }

    [data-md-color-primary="black"] .md-header {
        background-color: rgb(21 78 133) !important;
    }

    .md-header {
        color: white;
        position: initial;
        background-color: rgb(2 84 156);
    }

    .md-main__inner {
        margin: 0;
    }

    .md-content {
        display: none;
    }

    @media screen and (min-width: 60em) {
        .md-sidebar--secondary {
            display: none;
        }
    }

    @media screen and (min-width: 76.25em) {
        .md-sidebar--primary {
            display: none;
        }
    }

    @media screen and (max-width: 44.9375em) {
        .mdx-hero {
            min-height: calc(100vh - 2.4rem);
        }

        .mdx-hero__content h1 {
            font-size: 1.65rem;
        }
    }
</style>
<section class="mdx-container">
    <div class="md-grid md-typeset">
        <div class="mdx-hero">
            <div class="mdx-hero__image">
                <img src="{{ 'assets/images/home.jpg' | url }}" alt="" draggable="false">
                <div class="mdx-hero__content">
                    <h1>书山有路勤为径，学海无涯苦作舟</h1>
                    <p>循正而行，自与吉会</p>
                    <a href="{{ config.extra.home_url | url }}" title="开始阅读"
                       class="md-button md-button--primary">
                        Go
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
{% block content %}{% endblock %}
{% block footer %}{% endblock %}
